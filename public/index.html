<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>Game Suite</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        /* [Previous CSS remains largely unchanged, with the following additions for Settings and Voting UI] */
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { width: 100%; height: 100%; font-family: -apple-system, sans-serif; background: #f5f5f5; color: #333; overflow: hidden; }
        .container { width: 100vw; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .screen { display: none; width: 100%; height: 100%; position: absolute; top: 0; left: 0; overflow-y: auto; padding: 20px; align-items: center; justify-content: center; }
        .screen.active { display: flex; }
        .screen-center { width: 100%; max-width: 600px; display: flex; flex-direction: column; align-items: center; text-align: center; }
        
        /* Backgrounds & Typography */
        .bg-home, .bg-lobby, .bg-select, .bg-tod { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
        .bg-scores { background: linear-gradient(135deg, #FF9500 0%, #FF3B30 100%); color: white; }
        h1 { font-size: 42px; margin-bottom: 12px; }
        h2 { font-size: 32px; margin-bottom: 16px; }
        .highlight-text { color: #f1c40f; font-size: 28px; font-weight: 800; text-transform: uppercase; margin-bottom: 10px; text-shadow: 0 2px 4px rgba(0,0,0,0.3); }
        
        /* Buttons & Cards */
        .btn { width: 100%; max-width: 300px; padding: 16px 24px; border: none; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; margin-bottom: 12px; text-transform: uppercase; }
        .btn-primary { background: #007AFF; color: white; }
        .btn-success { background: #34C759; color: white; }
        .btn-danger { background: #FF3B30; color: white; }
        .btn-secondary { background: white; color: #007AFF; }
        
        .card, .challenge-card { background: white; color: #333; border-radius: 16px; padding: 24px; margin-bottom: 20px; width: 100%; max-width: 300px; text-align: center; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1); }
        .challenge-emoji { font-size: 72px; }
        .challenge-text { font-size: 20px; font-weight: 600; margin: 16px 0; }
        
        /* Settings Panel */
        .host-settings { background: rgba(0, 0, 0, 0.2); padding: 20px; border-radius: 12px; margin: 20px 0; width: 100%; max-width: 340px; text-align: left; }
        .settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
        .checkbox-label { display: flex; align-items: center; gap: 8px; font-size: 14px; cursor: pointer; color: white; }
        .rounds-input { width: 60px; padding: 8px; border-radius: 6px; border: none; text-align: center; font-weight: bold; }
        
        .vote-controls { display: flex; gap: 10px; width: 100%; justify-content: center; }
        .vote-controls .btn { max-width: 140px; }
        
        input { width: 100%; max-width: 300px; padding: 14px; border-radius: 10px; margin-bottom: 16px; text-align: center; border: 2px solid #E5E5E5; }
        .spacer-md { margin-bottom: 24px; }
        .status-bar { position: fixed; top: 12px; right: 16px; padding: 8px 14px; border-radius: 20px; font-size: 12px; background: #34C759; color: white; z-index: 999; }
    </style>
</head>
<body>
    <div class="status-bar" id="statusBar">Connected</div>

    <div class="container">
        <!-- HOME, LOBBY & MODALS (Kept minimal for layout, exactly as before) -->
        <div id="homeScreen" class="screen active bg-home">
            <div class="screen-center">
                <h1>🎮 Game Suite</h1>
                <input type="text" id="quickJoinCode" placeholder="Room Code" maxlength="6">
                <button class="btn btn-secondary" onclick="quickJoinFlow()">Join Room</button>
                <p>OR</p>
                <button class="btn btn-secondary" onclick="showCreateRoom()">Create Room</button>
            </div>
        </div>

        <!-- Create/Join Modals Setup -->
        <div id="createModal" class="screen" style="background: rgba(0,0,0,0.8); z-index: 50;">
            <div class="card">
                <h2>Create</h2>
                <input type="text" id="hostName" placeholder="Your Name">
                <button class="btn btn-primary" onclick="createRoom()">Start</button>
            </div>
        </div>

        <!-- LOBBY -->
        <div id="lobbyScreen" class="screen bg-lobby">
            <div class="screen-center">
                <h2>Lobby 🎉</h2>
                <div class="card" style="background: rgba(255,255,255,0.2); color:white;">
                    Code: <h1 id="displayCode" style="letter-spacing: 5px;">XXXXXX</h1>
                </div>
                <div id="playersList" style="margin-bottom: 20px;"></div>
                <button class="btn btn-success" onclick="showScreen('selectorScreen')">Select Game</button>
            </div>
        </div>

        <!-- GAME SELECTOR with Host Settings -->
        <div id="selectorScreen" class="screen bg-select">
            <div class="screen-center">
                <h2>Choose Game</h2>
                
                <!-- Host Settings Panel for Truth or Dare -->
                <div id="hostSettingsPanel" class="host-settings" style="display: none;">
                    <h3 style="color: white; margin-bottom: 10px;">⚙️ ToD Settings</h3>
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                        <span style="color: white;">Total Rounds:</span>
                        <input type="number" id="settingRounds" class="rounds-input" value="5" min="1" max="20" onchange="emitSettings()">
                    </div>
                    <span style="color: white; font-size: 14px;">Categories:</span>
                    <div class="settings-grid" id="categoryToggles">
                        <label class="checkbox-label"><input type="checkbox" value="easy" checked onchange="emitSettings()"> Easy</label>
                        <label class="checkbox-label"><input type="checkbox" value="medium" checked onchange="emitSettings()"> Medium</label>
                        <label class="checkbox-label"><input type="checkbox" value="hard" checked onchange="emitSettings()"> Hard</label>
                        <label class="checkbox-label"><input type="checkbox" value="intimate" onchange="emitSettings()"> Intimate</label>
                        <label class="checkbox-label"><input type="checkbox" value="spicy" onchange="emitSettings()"> Spicy</label>
                        <label class="checkbox-label"><input type="checkbox" value="couples" onchange="emitSettings()"> Couples</label>
                        <label class="checkbox-label"><input type="checkbox" value="drinking" onchange="emitSettings()"> Drinking</label>
                        <label class="checkbox-label"><input type="checkbox" value="general knowledge" onchange="emitSettings()"> Knowledge</label>
                    </div>
                </div>

                <div class="spacer-md"></div>
                <button class="btn btn-primary" onclick="startGame('truthordare')">🎭 Play Truth or Dare</button>
                <button class="btn btn-back" onclick="showScreen('lobbyScreen')">Back</button>
            </div>
        </div>

        <!-- TRUTH OR DARE SCREEN -->
        <div id="todScreen" class="screen bg-tod">
            <div class="screen-center">
                <div id="todHeader" class="highlight-text">PLAYER'S TURN!</div>
                <p id="todRoundInfo">Round <span id="roundNum">1</span> of <span id="totalRounds">5</span></p>

                <div class="challenge-card">
                    <div class="challenge-emoji" id="todEmoji">🎭</div>
                    <p id="todType" style="margin: 0; font-size: 14px; text-transform: uppercase; font-weight: bold; color: #007AFF;">Truth</p>
                    <p class="challenge-text" id="todText">Loading...</p>
                </div>

                <!-- Jury Voting System -->
                <div id="juryPanel" style="display: none; width: 100%;">
                    <p style="margin-bottom: 10px; font-weight: bold;">Did they do it?</p>
                    <div class="vote-controls">
                        <button class="btn btn-success" onclick="castVote(true)">✅ Pass</button>
                        <button class="btn btn-danger" onclick="castVote(false)">❌ Fail</button>
                    </div>
                </div>

                <div id="activePlayerPanel" style="display: none;">
                    <p style="font-style: italic; opacity: 0.8;">The group is deciding your fate...</p>
                </div>

                <div id="voteResults" style="display: none; margin-top: 15px; font-weight: bold; font-size: 20px;"></div>

                <div class="spacer-md"></div>
                <button class="btn btn-back" onclick="showScreen('selectorScreen')">Quit Game</button>
            </div>
        </div>

        <!-- SCORES SCREEN -->
        <div id="scoresScreen" class="screen bg-scores">
            <div class="screen-center">
                <h2>🏆 Winners!</h2>
                <div id="winnerNames" class="highlight-text" style="font-size: 40px; margin: 20px 0;"></div>
                <button class="btn btn-primary" onclick="showScreen('selectorScreen')">Play Again</button>
            </div>
        </div>
    </div>

    <script>
        let gameState = { roomCode: null, playerName: null, players: [], scores: {}, isHost: false };
        let socket = null;

        function initSocket() {
            if (socket) return;
            socket = io(window.location.origin);

            socket.on('playerJoined', (data) => {
                gameState.players = data.players;
                document.getElementById('playersList').innerHTML = data.players.map(p => `<div>✅ ${p}</div>`).join('');
                if (gameState.isHost) document.getElementById('hostSettingsPanel').style.display = 'block';
            });

            socket.on('todSettingsUpdated', (settings) => {
                document.getElementById('totalRounds').textContent = settings.totalRounds;
                document.getElementById('settingRounds').value = settings.totalRounds;
            });

            socket.on('gameModeSelected', (data) => {
                if (data.gameMode === 'truthordare') showScreen('todScreen');
            });

            socket.on('challengeGenerated', (data) => {
                // Reset UI states
                document.getElementById('voteResults').style.display = 'none';
                document.getElementById('todEmoji').textContent = data.challenge.emoji || '🎭';
                document.getElementById('todText').textContent = data.challenge.text;
                document.getElementById('todType').textContent = data.challenge.type;
                document.getElementById('roundNum').textContent = data.round;
                document.getElementById('totalRounds').textContent = data.totalRounds;
                
                if (data.isTieBreaker) {
                    document.getElementById('todRoundInfo').innerHTML = `<span style="color: #FF3B30; font-weight: bold;">🚨 TIE BREAKER 🚨</span>`;
                }

                // Identify if current player is the target
                if (data.currentPlayer === gameState.playerName) {
                    document.getElementById('todHeader').textContent = "YOUR TURN!";
                    document.getElementById('todHeader').style.color = "#34C759";
                    document.getElementById('activePlayerPanel').style.display = 'block';
                    document.getElementById('juryPanel').style.display = 'none';
                } else {
                    document.getElementById('todHeader').textContent = `${data.currentPlayer.toUpperCase()}'s TURN!`;
                    document.getElementById('todHeader').style.color = "#f1c40f";
                    document.getElementById('activePlayerPanel').style.display = 'none';
                    document.getElementById('juryPanel').style.display = 'block';
                }
            });

            socket.on('voteRegistered', (data) => {
                if (document.getElementById('activePlayerPanel').style.display === 'block') {
                    document.getElementById('activePlayerPanel').innerHTML = `<p>Waiting for judges... (${data.votesCast}/${data.votesNeeded})</p>`;
                }
            });

            socket.on('challengeJudged', (data) => {
                document.getElementById('juryPanel').style.display = 'none';
                document.getElementById('activePlayerPanel').style.display = 'none';
                const resultsEl = document.getElementById('voteResults');
                resultsEl.style.display = 'block';
                
                if (data.passed) {
                    resultsEl.innerHTML = `✅ PASSED!<br><span style="font-size:14px; font-weight:normal;">(${data.passes} Yes / ${data.fails} No)</span>`;
                    resultsEl.style.color = "#34C759";
                } else {
                    resultsEl.innerHTML = `❌ FAILED!<br><span style="font-size:14px; font-weight:normal;">(${data.fails} No / ${data.passes} Yes)</span>`;
                    resultsEl.style.color = "#FF3B30";
                }
            });

            socket.on('todTieBreaker', (data) => {
                alert(`It's a tie! Sudden death for: ${data.tiedPlayers.join(', ')}`);
            });

            socket.on('todGameOver', (data) => {
                document.getElementById('winnerNames').textContent = data.winners.join(' & ');
                showScreen('scoresScreen');
            });
        }

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function showCreateRoom() { showScreen('createModal'); }
        
        function createRoom() {
            const name = document.getElementById('hostName').value.trim();
            if (!name) return alert('Enter name');
            fetch('/api/rooms/create', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({playerName: name}) })
            .then(r => r.json()).then(d => {
                gameState = { roomCode: d.roomCode, playerName: name, isHost: true };
                document.getElementById('displayCode').textContent = d.roomCode;
                initSocket();
                socket.emit('joinRoom', { roomCode: d.roomCode, playerName: name });
                showScreen('lobbyScreen');
            });
        }

        function emitSettings() {
            if (!gameState.isHost) return;
            const rounds = document.getElementById('settingRounds').value;
            const categories = Array.from(document.querySelectorAll('#categoryToggles input:checked')).map(cb => cb.value);
            socket.emit('updateTodSettings', { roomCode: gameState.roomCode, categories, totalRounds: parseInt(rounds) });
        }

        function startGame(mode) {
            socket.emit('selectGameMode', { roomCode: gameState.roomCode, gameMode: mode });
        }

        function castVote(passed) {
            document.getElementById('juryPanel').style.display = 'none';
            document.getElementById('activePlayerPanel').style.display = 'block';
            document.getElementById('activePlayerPanel').innerHTML = `<p>Vote registered. Waiting for others...</p>`;
            socket.emit('judgeChallenge', { roomCode: gameState.roomCode, playerName: gameState.playerName, passed });
        }
    </script>
</body>
</html>
