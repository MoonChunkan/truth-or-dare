<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#667eea">
    <title>Multiplayer Game Suite</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { width: 100%; height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        body { background: #f5f7fa; position: fixed; left: 0; top: 0; overflow: hidden; }

        .container { width: 100vw; height: 100vh; display: flex; flex-direction: column; }
        .screen { display: none; width: 100%; height: 100%; overflow-y: auto; -webkit-overflow-scrolling: touch; flex: 1; }
        .screen.active { display: flex; flex-direction: column; }

        .status-bar {
            position: fixed;
            top: 12px;
            right: 12px;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 12px;
            background: #2ecc71;
            color: white;
            z-index: 999;
            font-weight: 600;
        }

        .status-bar.offline {
            background: #e74c3c;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        /* UNIVERSAL STYLES */
        .screen {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            align-items: center;
            justify-content: center;
        }

        .content {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            text-align: center;
        }

        h1 {
            font-size: clamp(32px, 10vw, 48px);
            margin-bottom: 20px;
            font-weight: 800;
        }

        button {
            padding: 16px 24px;
            border: none;
            border-radius: 12px;
            font-size: clamp(14px, 4vw, 16px);
            font-weight: 700;
            cursor: pointer;
            min-height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
            width: 100%;
            touch-action: manipulation;
            margin-bottom: 12px;
        }

        button:active { transform: scale(0.95); }
        button:disabled { opacity: 0.5; }

        .btn-primary { background: white; color: #667eea; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        .btn-secondary { background: rgba(255,255,255,0.95); color: #667eea; }
        .btn-success { background: #2ecc71; color: white; }
        .btn-info { background: #3498db; color: white; }
        .btn-danger { background: #e74c3c; color: white; }
        .btn-back { background: rgba(255,255,255,0.15); color: white; backdrop-filter: blur(10px); }

        input {
            width: 100%;
            padding: 14px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 10px;
            font-size: 16px;
            margin-bottom: 12px;
            background: rgba(255,255,255,0.1);
            color: white;
        }

        input::placeholder { color: rgba(255,255,255,0.6); }
        input:focus { outline: none; border-color: white; background: rgba(255,255,255,0.15); }

        .button-row {
            display: flex;
            gap: 12px;
            width: 100%;
            margin-bottom: 12px;
        }

        .button-row button {
            flex: 1;
            margin-bottom: 0;
        }

        /* Menu Screen */
        .menu-screen { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }

        /* Game Selector Screen */
        .selector-screen {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            overflow-y: auto;
        }

        .game-option {
            background: white;
            color: #333;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 15px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            text-align: left;
            width: 100%;
            border: none;
            min-height: auto;
        }

        .game-option:hover { transform: translateY(-5px); box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        .game-option h3 { font-size: 20px; margin-bottom: 8px; }
        .game-option p { font-size: 14px; opacity: 0.7; }

        /* Truth or Dare Screen */
        .tod-screen {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            justify-content: flex-start;
            padding-top: 40px;
        }

        .challenge-card {
            background: white;
            color: #333;
            border-radius: 16px;
            padding: clamp(20px, 5vw, 28px);
            margin-bottom: 20px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
            min-height: 320px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .challenge-emoji { font-size: clamp(48px, 15vw, 64px); margin: 16px 0; }
        .challenge-text { font-size: clamp(16px, 4.5vw, 20px); font-weight: 600; margin: 16px 0; line-height: 1.6; }

        /* Higher or Lower Screen */
        .hol-screen { background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%); }
        .card-display {
            background: white;
            color: #333;
            font-size: 80px;
            font-weight: bold;
            padding: 40px 20px;
            border-radius: 16px;
            text-align: center;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            width: 200px;
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-left: auto;
            margin-right: auto;
        }

        /* Battleships Screen */
        .battleship-screen { background: linear-gradient(135deg, #3498db 0%, #2980b9 100%); }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 2px;
            margin: 20px 0;
            background: rgba(255,255,255,0.1);
            padding: 10px;
            border-radius: 8px;
            width: 100%;
            max-width: 400px;
        }

        .grid-cell {
            width: 100%;
            aspect-ratio: 1;
            background: #2980b9;
            border: 1px solid rgba(255,255,255,0.3);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
            border-radius: 4px;
            transition: all 0.2s;
        }

        .grid-cell:hover { background: #1a5f8f; }
        .grid-cell.ship { background: #34495e; }
        .grid-cell.hit { background: #e74c3c; }
        .grid-cell.miss { background: #95a5a6; }

        /* Wordle Screen */
        .wordle-screen { background: linear-gradient(135deg, #9b59b6 0%, #8e44ad 100%); }
        .guess-input {
            padding: 12px;
            border-radius: 8px;
            border: 2px solid white;
            font-size: 16px;
            text-transform: uppercase;
            width: 100%;
            margin-bottom: 12px;
            background: rgba(255,255,255,0.1);
            color: white;
        }

        .guess-input::placeholder { color: rgba(255,255,255,0.6); }
        .guess-input:focus { outline: none; background: rgba(255,255,255,0.2); }

        .word-feedback {
            display: flex;
            gap: 4px;
            margin: 12px 0;
            justify-content: center;
            flex-wrap: wrap;
        }

        .feedback-letter {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            font-weight: bold;
            font-size: 16px;
            color: white;
        }

        .feedback-letter.correct { background: #2ecc71; }
        .feedback-letter.present { background: #f39c12; }
        .feedback-letter.absent { background: #95a5a6; }

        /* Scores Screen */
        .scores-screen {
            background: linear-gradient(135deg, #f39c12 0%, #e74c3c 100%);
            overflow-y: auto;
        }

        .leaderboard-item {
            padding: clamp(14px, 4vw, 18px);
            border-radius: 12px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
            font-weight: 700;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .leaderboard-item.gold { background: linear-gradient(135deg, #f1c40f 0%, #f39c12 100%); }
        .leaderboard-item.silver { background: linear-gradient(135deg, #ecf0f1 0%, #bdc3c7 100%); color: #333; }
        .leaderboard-item.bronze { background: linear-gradient(135deg, #cd7f32 0%, #a0522d 100%); }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
            backdrop-filter: blur(5px);
        }

        .modal.active { display: flex; }
        .modal-content {
            background: white;
            padding: 28px;
            border-radius: 16px;
            max-width: 340px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .modal-content h2 {
            margin: 0 0 20px 0;
            color: #333;
            font-size: clamp(18px, 5vw, 24px);
        }

        .modal-content input {
            background: white;
            color: #333;
            border: 2px solid #e8ecf1;
        }

        .info-text {
            background: rgba(255,255,255,0.15);
            padding: 12px;
            border-radius: 8px;
            margin: 15px 0;
            font-size: 14px;
            line-height: 1.6;
        }

        .score-display {
            background: rgba(255,255,255,0.2);
            padding: 12px;
            border-radius: 8px;
            margin: 12px 0;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="status-bar" id="statusBar">🟢 Connected</div>
    <div class="container">
        <!-- Menu Screen -->
        <div id="menuScreen" class="screen active menu-screen">
            <div class="content">
                <h1>🎮 Game Suite</h1>
                <p style="font-size: 16px; margin-bottom: 40px; opacity: 0.9;">4 Multiplayer Games</p>
                <div class="button-group">
                    <button class="btn-primary" onclick="showCreateRoom()">👥 Create Room</button>
                    <button class="btn-secondary" onclick="showJoinModal()">🔑 Join Game</button>
                </div>
            </div>
        </div>

        <!-- Create Room Modal -->
        <div id="createModal" class="modal">
            <div class="modal-content">
                <h2>Create Game Room</h2>
                <input type="text" id="hostName" placeholder="Your Name" maxlength="20">
                <button class="btn-primary" onclick="createRoom()">Create</button>
                <button class="btn-back" onclick="closeCreateModal()">Cancel</button>
            </div>
        </div>

        <!-- Join Room Modal -->
        <div id="joinModal" class="modal">
            <div class="modal-content">
                <h2>Join Game Room</h2>
                <input type="text" id="joinCode" placeholder="Room Code" maxlength="6" style="text-transform: uppercase;">
                <input type="text" id="joinName" placeholder="Your Name" maxlength="20">
                <button class="btn-primary" onclick="joinRoom()">Join</button>
                <button class="btn-back" onclick="closeJoinModal()">Cancel</button>
            </div>
        </div>

        <!-- Game Selector Screen -->
        <div id="selectorScreen" class="screen selector-screen">
            <div class="content">
                <h1>Select Game</h1>
                <button class="game-option" onclick="selectGame('truthordare')">
                    <h3>🎉 Truth or Dare</h3>
                    <p>Classic party game with progressive difficulty</p>
                </button>
                <button class="game-option" onclick="selectGame('higherlower')">
                    <h3>🃏 Higher or Lower</h3>
                    <p>Real-time card guessing game</p>
                </button>
                <button class="game-option" onclick="selectGame('battleships')">
                    <h3>⚓ Battleships</h3>
                    <p>Classic naval strategy game</p>
                </button>
                <button class="game-option" onclick="selectGame('wordle')">
                    <h3>🎮 Wordle</h3>
                    <p>Guess secret words, 10 attempts</p>
                </button>
                <button class="btn-back" onclick="goToMenu()">← Menu</button>
            </div>
        </div>

        <!-- Truth or Dare Screen -->
        <div id="todScreen" class="screen tod-screen">
            <div class="content">
                <p id="roundInfo" style="font-size: 14px; opacity: 0.9;">Round 1 / 5</p>
                <div class="challenge-card" id="challengeCard">
                    <div class="challenge-emoji" id="challengeEmoji">🎭</div>
                    <p style="font-size: 12px; opacity: 0.8;">Truth or Dare</p>
                    <p class="challenge-text" id="challengeText">Loading challenge...</p>
                </div>
                <div class="button-row">
                    <button class="btn-success" onclick="completeChallenge()">✅ Done</button>
                    <button class="btn-info" onclick="skipChallenge()">⏭️ Skip</button>
                </div>
                <button class="btn-back" onclick="goToSelector()">← Change Game</button>
            </div>
        </div>

        <!-- Higher or Lower Screen -->
        <div id="holScreen" class="screen hol-screen">
            <div class="content">
                <h1>🃏 Higher or Lower</h1>
                <p id="currentPlayer" style="margin-bottom: 20px;">Your turn!</p>
                <div class="card-display" id="cardDisplay">7♥</div>
                <div class="button-row">
                    <button class="btn-primary" onclick="guessCard('higher')">📈 Higher</button>
                    <button class="btn-primary" onclick="guessCard('lower')">📉 Lower</button>
                </div>
                <p id="cardResult" style="margin-top: 20px;"></p>
                <button class="btn-back" onclick="goToSelector()">← Change Game</button>
            </div>
        </div>

        <!-- Battleships Screen -->
        <div id="battleshipScreen" class="screen battleship-screen">
            <div class="content">
                <h1>⚓ Battleships</h1>
                <p style="margin-bottom: 20px;">Place your ships (5-4-3-3-2 cells)</p>
                <div class="grid-container" id="battleshipGrid"></div>
                <button class="btn-success" onclick="startBattleships()" style="margin-top: 20px;">Start Game</button>
                <button class="btn-back" onclick="goToSelector()">← Change Game</button>
            </div>
        </div>

        <!-- Wordle Screen -->
        <div id="wordleScreen" class="screen wordle-screen">
            <div class="content">
                <h1>🎮 Wordle</h1>
                <p style="margin-bottom: 20px;" id="wordleStatus">Enter your secret word</p>
                <input type="text" id="wordleWord" placeholder="5-letter word" maxlength="5" style="text-transform: uppercase;">
                <button class="btn-success" onclick="submitWordleWord()">Set Word</button>
                <div id="wordleGuesses"></div>
                <button class="btn-back" onclick="goToSelector()">← Change Game</button>
            </div>
        </div>

        <!-- Scores Screen -->
        <div id="scoresScreen" class="screen scores-screen">
            <div class="content">
                <h1>🏆 Scores</h1>
                <div id="leaderboard"></div>
                <div class="button-row">
                    <button class="btn-success" onclick="playAgain()">🔄 Play Again</button>
                    <button class="btn-info" onclick="goToSelector()">🎮 Different Game</button>
                </div>
                <button class="btn-back" onclick="goToMenu()">← Menu</button>
            </div>
        </div>
    </div>

    <script>
        let gameState = {
            roomCode: null,
            playerName: null,
            players: [],
            scores: {},
            gameMode: null,
            isPlaying: false
        };

        let socket = null;

        function initSocket() {
            const serverUrl = window.location.origin;
            socket = io(serverUrl, {
                reconnection: true,
                reconnectionDelay: 1000,
                reconnectionDelayMax: 5000,
                reconnectionAttempts: 10
            });

            socket.on('connect', () => {
                updateStatus('🟢 Connected', false);
            });

            socket.on('disconnect', () => {
                updateStatus('🔴 Disconnected', true);
            });

            socket.on('playerJoined', (data) => {
                gameState.players = data.players;
                gameState.scores = data.scores;
            });

            socket.on('gameModeSelected', (data) => {
                gameState.gameMode = data.gameMode;
                gameState.players = data.players;
                gameState.scores = data.scores;
                startGameMode(data.gameMode);
            });

            socket.on('challengeGenerated', (data) => {
                document.getElementById('challengeEmoji').textContent = data.challenge.emoji || '🎭';
                document.getElementById('challengeText').textContent = data.challenge.text;
                document.getElementById('roundInfo').textContent = `Round ${data.round} / ${data.totalRounds}`;
            });

            socket.on('cardGenerated', (data) => {
                document.getElementById('cardDisplay').textContent = data.card;
            });

            socket.on('cardGuessResult', (data) => {
                const resultText = data.correct ? '✅ Correct!' : '❌ Wrong!';
                document.getElementById('cardResult').textContent = resultText;
            });

            socket.on('scoreUpdated', (data) => {
                gameState.scores = data.scores;
                updateScores();
            });

            socket.on('returnedToLobby', (data) => {
                gameState.players = data.players;
                gameState.scores = data.scores;
                showScores();
            });

            socket.on('error', (message) => {
                alert('Error: ' + message);
            });
        }

        function updateStatus(text, isOffline) {
            const bar = document.getElementById('statusBar');
            bar.textContent = text;
            if (isOffline) {
                bar.classList.add('offline');
            } else {
                bar.classList.remove('offline');
            }
        }

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            window.scrollTo(0, 0);
        }

        // Room Management
        function showCreateRoom() {
            document.getElementById('createModal').classList.add('active');
            document.getElementById('hostName').focus();
        }

        function closeCreateModal() {
            document.getElementById('createModal').classList.remove('active');
        }

        function createRoom() {
            const name = document.getElementById('hostName').value.trim();
            if (!name) { alert('Enter your name'); return; }

            fetch('/api/rooms/create', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ playerName: name })
            })
            .then(r => r.json())
            .then(d => {
                if (d.success) {
                    gameState.roomCode = d.roomCode;
                    gameState.playerName = name;
                    closeCreateModal();
                    initSocket();
                    socket.emit('joinRoom', { roomCode: d.roomCode, playerName: name });
                    showScreen('selectorScreen');
                }
            });
        }

        function showJoinModal() {
            document.getElementById('joinModal').classList.add('active');
            document.getElementById('joinCode').focus();
        }

        function closeJoinModal() {
            document.getElementById('joinModal').classList.remove('active');
        }

        function joinRoom() {
            const code = document.getElementById('joinCode').value.toUpperCase().trim();
            const name = document.getElementById('joinName').value.trim();

            if (!code || code.length !== 6) { alert('Invalid room code'); return; }
            if (!name) { alert('Enter your name'); return; }

            fetch('/api/rooms/join', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ roomCode: code, playerName: name })
            })
            .then(r => r.json())
            .then(d => {
                if (d.success) {
                    gameState.roomCode = code;
                    gameState.playerName = name;
                    gameState.players = d.room.players;
                    gameState.scores = Object.fromEntries(d.room.players.map(p => [p, 0]));
                    closeJoinModal();
                    initSocket();
                    socket.emit('joinRoom', { roomCode: code, playerName: name });
                    showScreen('selectorScreen');
                } else {
                    alert('Failed to join: ' + d.error);
                }
            });
        }

        // Game Selection
        function selectGame(mode) {
            if (socket && gameState.roomCode) {
                socket.emit('selectGameMode', { roomCode: gameState.roomCode, gameMode: mode });
            }
        }

        function startGameMode(mode) {
            if (mode === 'truthordare') {
                if (socket && gameState.roomCode) {
                    socket.emit('getChallenge', { roomCode: gameState.roomCode });
                }
                showScreen('todScreen');
            } else if (mode === 'higherlower') {
                if (socket && gameState.roomCode) {
                    socket.emit('generateCard', { roomCode: gameState.roomCode });
                }
                showScreen('holScreen');
            } else if (mode === 'battleships') {
                generateBattleshipGrid();
                showScreen('battleshipScreen');
            } else if (mode === 'wordle') {
                showScreen('wordleScreen');
            }
        }

        // Game Functions
        function completeChallenge() {
            if (socket && gameState.roomCode) {
                socket.emit('getChallenge', { roomCode: gameState.roomCode });
            }
        }

        function skipChallenge() {
            if (socket && gameState.roomCode) {
                socket.emit('skipChallenge', { roomCode: gameState.roomCode });
            }
        }

        function guessCard(guess) {
            if (socket && gameState.roomCode) {
                socket.emit('guessCard', {
                    roomCode: gameState.roomCode,
                    guess: guess,
                    playerName: gameState.playerName
                });
            }
        }

        function generateBattleshipGrid() {
            const grid = document.getElementById('battleshipGrid');
            grid.innerHTML = '';
            for (let i = 0; i < 100; i++) {
                const cell = document.createElement('div');
                cell.className = 'grid-cell';
                cell.textContent = i;
                grid.appendChild(cell);
            }
        }

        function startBattleships() {
            if (socket && gameState.roomCode) {
                const ships = [
                    { x: 0, y: 0, length: 5, horizontal: true },
                    { x: 0, y: 1, length: 4, horizontal: true },
                    { x: 0, y: 2, length: 3, horizontal: true },
                    { x: 0, y: 3, length: 3, horizontal: true },
                    { x: 0, y: 4, length: 2, horizontal: true }
                ];
                socket.emit('placeBattleships', { roomCode: gameState.roomCode, playerName: gameState.playerName, ships });
            }
        }

        function submitWordleWord() {
            const word = document.getElementById('wordleWord').value.toUpperCase().trim();
            if (word.length !== 5) { alert('Word must be 5 letters'); return; }

            if (socket && gameState.roomCode) {
                socket.emit('setWordleWord', {
                    roomCode: gameState.roomCode,
                    playerName: gameState.playerName,
                    word: word
                });
                document.getElementById('wordleWord').value = '';
                document.getElementById('wordleStatus').textContent = 'Word set! Waiting for others...';
            }
        }

        function updateScores() {
            const sorted = Object.entries(gameState.scores).sort((a, b) => b[1] - a[1]);
            const leaderboard = document.getElementById('leaderboard');
            leaderboard.innerHTML = sorted.map((item, idx) => {
                const [player, score] = item;
                const className = idx === 0 ? 'gold' : idx === 1 ? 'silver' : idx === 2 ? 'bronze' : '';
                const medal = idx === 0 ? '🥇' : idx === 1 ? '🥈' : idx === 2 ? '🥉' : `${idx + 1}.`;
                return `
                    <div class="leaderboard-item ${className}">
                        <span>${medal} ${player}</span>
                        <span>${score}</span>
                    </div>
                `;
            }).join('');
        }

        function showScores() {
            updateScores();
            showScreen('scoresScreen');
        }

        function playAgain() {
            if (socket && gameState.roomCode) {
                socket.emit('returnToLobby', { roomCode: gameState.roomCode });
                showScreen('selectorScreen');
            }
        }

        function goToSelector() {
            showScreen('selectorScreen');
        }

        function goToMenu() {
            if (gameState.roomCode && socket) {
                socket.emit('leaveRoom', { roomCode: gameState.roomCode, playerName: gameState.playerName });
            }
            gameState = { roomCode: null, playerName: null, players: [], scores: {}, gameMode: null, isPlaying: false };
            showScreen('menuScreen');
        }

        // Initialize
        initSocket();
    </script>
</body>
</html>
