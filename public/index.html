<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#667eea">
    <title>Truth or Dare - Multiplayer Party Game</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        body {
            background: #f5f7fa;
            position: fixed;
            left: 0;
            top: 0;
        }

        .container {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .screen {
            display: none;
            width: 100%;
            height: 100%;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .screen.active {
            display: flex;
            flex-direction: column;
        }

        /* Status Bar */
        .status-bar {
            position: fixed;
            top: 12px;
            right: 12px;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 12px;
            background: #2ecc71;
            color: white;
            z-index: 999;
            font-weight: 600;
        }

        .status-bar.offline {
            background: #e74c3c;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        /* Menu Screen */
        .menu-screen {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
            color: white;
        }

        .menu-content {
            width: 100%;
            max-width: 500px;
        }

        .menu-content h1 {
            font-size: clamp(40px, 12vw, 56px);
            margin: 20px 0 10px 0;
            font-weight: 800;
            letter-spacing: -1px;
        }

        .menu-content p {
            font-size: clamp(14px, 4vw, 18px);
            margin-bottom: 50px;
            opacity: 0.9;
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        button {
            padding: 18px;
            border: none;
            border-radius: 14px;
            font-size: clamp(14px, 4vw, 16px);
            font-weight: 700;
            cursor: pointer;
            min-height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
            width: 100%;
            touch-action: manipulation;
        }

        button:active {
            transform: scale(0.95);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-primary { background: white; color: #667eea; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        .btn-secondary { background: rgba(255,255,255,0.95); color: #667eea; }
        .btn-success { background: #2ecc71; color: white; }
        .btn-danger { background: #e74c3c; color: white; }
        .btn-info { background: #3498db; color: white; }
        .btn-warning { background: #f39c12; color: white; }
        .btn-back { background: rgba(255,255,255,0.15); color: white; backdrop-filter: blur(10px); }

        /* Setup Screen */
        .setup-screen {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 0;
        }

        .setup-content {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            padding: clamp(15px, 5vw, 25px);
            padding-bottom: 40px;
        }

        .setup-header {
            text-align: center;
            margin-bottom: 25px;
            color: white;
        }

        .setup-header h1 {
            font-size: clamp(24px, 8vw, 32px);
            margin: 0 0 8px 0;
            font-weight: 800;
        }

        .code-display {
            background: rgba(255,255,255,0.15);
            padding: 18px;
            border-radius: 12px;
            margin-bottom: 20px;
            text-align: center;
            border: 2px solid rgba(255,255,255,0.3);
            backdrop-filter: blur(10px);
        }

        .code-display .label {
            font-size: 11px;
            opacity: 0.8;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .code-display .code {
            font-size: clamp(24px, 6vw, 32px);
            font-weight: 900;
            letter-spacing: 8px;
            font-family: 'Courier New', monospace;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: clamp(16px, 4vw, 24px);
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .section-title {
            font-size: clamp(13px, 3.5vw, 15px);
            font-weight: 700;
            margin-bottom: 16px;
            color: #333;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .player-list {
            margin-bottom: 16px;
            max-height: 180px;
            overflow-y: auto;
        }

        .player-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: clamp(10px, 3vw, 14px);
            background: linear-gradient(135deg, #f5f7fa 0%, #e8ecf1 100%);
            border-radius: 10px;
            margin-bottom: 8px;
            font-size: clamp(13px, 3.5vw, 15px);
            font-weight: 600;
        }

        .player-item button {
            background: none;
            border: none;
            color: #e74c3c;
            font-size: 22px;
            cursor: pointer;
            padding: 0;
            margin: 0;
            min-height: auto;
            width: auto;
        }

        .input-group {
            display: flex;
            gap: 8px;
            width: 100%;
            margin-bottom: 14px;
        }

        input[type="text"] {
            flex: 1;
            padding: clamp(12px, 3vw, 14px);
            border-radius: 10px;
            border: 2px solid #e8ecf1;
            font-size: clamp(14px, 3.5vw, 16px);
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .input-group button {
            width: auto;
            padding: clamp(12px, 3vw, 14px) clamp(14px, 4vw, 18px);
            flex-shrink: 0;
        }

        .difficulty-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .difficulty-btn {
            padding: 14px;
            border: 2px solid transparent;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 700;
            text-transform: uppercase;
            transition: all 0.2s;
            min-height: 56px;
            font-size: clamp(11px, 3vw, 13px);
        }

        .difficulty-btn.inactive { 
            background: #ecf0f1; 
            color: #95a5a6;
        }
        .difficulty-btn.easy { 
            background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%); 
            color: white;
        }
        .difficulty-btn.medium { 
            background: linear-gradient(135deg, #3498db 0%, #2980b9 100%); 
            color: white;
        }
        .difficulty-btn.hard { 
            background: linear-gradient(135deg, #f39c12 0%, #d68910 100%); 
            color: white;
        }
        .difficulty-btn.intimate { 
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%); 
            color: white;
        }

        .playing-screen {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);

        }

        .playing-content {

            align-items: center;
            margin-bottom: 20px;
            color: white;
            font-size: clamp(12px, 3vw, 14px);
            font-weight: 600;
        }

            border-radius: 16px;

            margin-bottom: 20px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);

            display: flex;
            flex-direction: column;
            justify-content: center;

        .player-name {

            margin: 0 0 14px 0;
            font-size: clamp(12px, 3.5vw, 14px);
            font-weight: 700;
            text-transform: uppercase;

            border-radius: 8px;
            margin-bottom: 20px;

            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .challenge-type.dare {
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
        }

        .challenge-type.intimate {
            background: linear-gradient(135deg, #d946ef 0%, #a21caf 100%);
        }

        .challenge-emoji {
            font-size: clamp(48px, 15vw, 64px);
            margin: 16px 0;
            line-height: 1;
        }

        .challenge-text {
            font-size: clamp(16px, 4.5vw, 20px);
            color: #333;
            line-height: 1.6;
            margin: 16px 0;
            font-weight: 600;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .points {
            color: #667eea;
            font-size: clamp(12px, 3.5vw, 14px);
            margin: 8px 0 0 0;
            font-weight: 700;
        }

        .button-row {
            display: flex;
            gap: 12px;
            margin-bottom: 12px;
        }

        .button-row button {
            flex: 1;
        }

        /* Scores Screen */
        .scores-screen {
            background: linear-gradient(135deg, #f39c12 0%, #e74c3c 100%);
            padding: clamp(15px, 5vw, 20px);
            padding-bottom: 40px;
        }

        .scores-content {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
        }

        .scores-content h1 {
            font-size: clamp(28px, 8vw, 36px);
            text-align: center;
            color: white;
            margin: 0 0 30px 0;
            font-weight: 800;
        }

        .leaderboard-item {
            padding: clamp(14px, 4vw, 18px);
            border-radius: 12px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
            font-weight: 700;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .leaderboard-item.gold { background: linear-gradient(135deg, #f1c40f 0%, #f39c12 100%); }
        .leaderboard-item.silver { background: linear-gradient(135deg, #ecf0f1 0%, #bdc3c7 100%); color: #333; }
        .leaderboard-item.bronze { background: linear-gradient(135deg, #cd7f32 0%, #a0522d 100%); }
        .leaderboard-item { background: linear-gradient(135deg, #95a5a6 0%, #7f8c8d 100%); }

        .medal {
            font-size: clamp(20px, 5vw, 26px);
            margin-right: 12px;
        }

        .player-info {
            display: flex;
            align-items: center;
            flex: 1;
        }

        .player-score {
            font-size: clamp(16px, 4vw, 20px);
            font-weight: 800;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
            backdrop-filter: blur(5px);
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 28px;
            border-radius: 16px;
            max-width: 340px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .modal-content h2 {
            margin: 0 0 20px 0;
            color: #333;
            font-size: clamp(18px, 5vw, 24px);
            font-weight: 800;
        }

        .modal-content input {
            width: 100%;
            margin-bottom: 14px;
            padding: 14px;
            border: 2px solid #e8ecf1;
            border-radius: 10px;
            font-size: 16px;
        }

        .modal-content input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .modal-button-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Lobby Screen */
        .lobby-screen {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .lobby-content {
            width: 100%;
            max-width: 500px;
            text-align: center;
            color: white;
        }

        .lobby-content h1 {
            font-size: clamp(26px, 8vw, 36px);
            margin: 0 0 20px 0;
            font-weight: 800;
        }

        .players-box {
            background: rgba(255,255,255,0.15);
            padding: 24px;
            border-radius: 16px;
            margin: 30px 0;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
        }

        .players-box h3 {
            margin: 0 0 16px 0;
            font-size: clamp(14px, 4vw, 16px);
            font-weight: 600;
        }

        .players-box p {
            margin: 10px 0;
            font-size: clamp(13px, 3.5vw, 15px);
            font-weight: 500;

    </style>
</head>
<body>
    <div class="status-bar" id="statusBar">🟢 Connected</div>

    <div class="container">
        <!-- Menu Screen -->

            </div>

        <!-- Setup Screen -->
        <div id="setupScreen" class="screen setup-screen">
            <div class="setup-content">
                <button class="btn-back" onclick="goToMenu()" style="width: 100%; margin-bottom: 20px;">← Back</button>
                
                <div class="setup-header">
                    <h1 id="setupTitle">Setup Game</h1>
                    <div id="codeDisplay" class="code-display" style="display: none;">
                        <div class="label">Room Code</div>
                        <div class="code" id="roomCode"></div>
                    </div>
                </div>

                <div class="card">
                    <p class="section-title">👥 Players</p>
                    <div class="player-list" id="playerList"></div>
                    <div class="input-group">
                        <input type="text" id="playerInput" placeholder="Your name" maxlength="20">
                        <button class="btn-info" onclick="addPlayer()">Add</button>
                    </div>
                </div>

                <div class="card">
                    <p class="section-title">⚙️ Difficulty Levels</p>
                    <div class="difficulty-grid">
                        <button class="difficulty-btn easy" onclick="toggleDifficulty('easy')">Easy</button>
                        <button class="difficulty-btn medium" onclick="toggleDifficulty('medium')">Medium</button>
                        <button class="difficulty-btn hard" onclick="toggleDifficulty('hard')">Hard</button>
                        <button class="difficulty-btn intimate" onclick="toggleDifficulty('intimate')">Spicy 🔥</button>
                    </div>
                </div>

                <button id="startGameBtn" class="btn-success" onclick="startGame()" style="width: 100%; margin-bottom: 12px;">🚀 Start Game</button>
            </div>
        </div>

        <!-- Lobby Screen -->
        <div id="lobbyScreen" class="screen lobby-screen">
            <div class="lobby-content">
                <h1>Waiting for Players...</h1>
                <div class="code-display">
                    <div class="label">Room Code</div>
                    <div class="code" id="lobbyCode"></div>
                </div>

                <div class="players-box">
                    <h3>Players in Room</h3>
                    <div id="lobbyPlayers"></div>
                </div>

                <div class="button-group">
                    <button class="btn-success" onclick="startGameFromLobby()">🎮 Everyone Ready - Start!</button>
                    <button class="btn-back" onclick="goToMenu()">← Exit</button>
                </div>
            </div>
        </div>

        <!-- Playing Screen -->
        <div id="playingScreen" class="screen playing-screen">
            <div class="playing-content">
                <div class="header-row">
                    <span id="roundInfo">Round 1</span>
                    <button class="btn-warning" onclick="showScores()" style="width: auto; padding: 8px 12px; min-height: auto; border-radius: 8px;">🏆</button>
                </div>

                <div class="challenge-card">
                    <p class="player-name" id="currentPlayer"></p>
                    <div class="challenge-type" id="challengeType"></div>
                    <div class="challenge-emoji" id="challengeEmoji"></div>
                    <p class="challenge-text" id="challengeText"></p>
                    <p class="points" id="points"></p>
                </div>

                <div class="button-row">
                    <button class="btn-success" onclick="completeChallenge()">✅ Done!</button>
                </div>

                <div class="button-row">
                    <button class="btn-info" onclick="differentChallenge()">🔄 Different</button>
                    <button class="btn-info" style="background: #95a5a6;" onclick="skipChallenge()">⏭️ Skip</button>
                </div>

                <button class="btn-back" onclick="goToMenu()" style="width: 100%;">← Exit Game</button>
            </div>
        </div>

        <!-- Scores Screen -->
        <div id="scoresScreen" class="screen scores-screen">
            <button class="btn-back" onclick="showPlaying()" style="width: calc(100% - 30px); margin: 15px; margin-bottom: 0;">← Back</button>
            <div class="scores-content">
                <h1>🏆 Leaderboard</h1>
                <div id="leaderboard"></div>
            </div>
        </div>

        <!-- Join Modal -->
        <div id="joinModal" class="modal">
            <div class="modal-content">
                <h2>Join Game</h2>
                <input type="text" id="joinCode" placeholder="Room Code" maxlength="6" style="text-transform: uppercase;">
                <input type="text" id="joinName" placeholder="Your Name" maxlength="20">
                <div class="modal-button-group">
                    <button class="btn-primary" onclick="joinRoom()">🔓 Join</button>
                    <button class="btn-back" onclick="closeJoinModal()">Cancel</button>
                </div>
            </div>
        </div>
    </div>

                    { text: "Speak in a funny accent for the next 3 turns", emoji: "🗣️" },
                    { text: "Give someone here a genuine compliment", emoji: "👍" },
                    { text: "Make the saddest face possible", emoji: "😢" },

                    { text: "Show your most unflattering photo", emoji: "📸" },

                ],
                medium: [

                    { text: "Let someone scroll through your phone for 2 min", emoji: "📱" },
                    { text: "Write a funny poem about someone and read it", emoji: "📝" },
                    { text: "Do a runway walk as seductively as possible", emoji: "🚶" },
                    { text: "Rank everyone here by attractiveness honestly", emoji: "⭐" },
                    { text: "Propose to someone here dramatically", emoji: "💍" },
                    { text: "Do impressions of everyone in the room", emoji: "🎬" },
                    { text: "Eat a spicy snack and react honestly", emoji: "🌶️" },
                    { text: "Twerk for 20 seconds in front of everyone", emoji: "🍑" },
                    { text: "Roleplay being arrested and call someone as a joke", emoji: "☎️" },
                ],
                hard: [
                    { text: "Record yourself crying (real or acted)", emoji: "😭" },
                    { text: "Tell the group your biggest secret", emoji: "🗣️" },
                    { text: "Tell someone here something real you held back", emoji: "💬" },
                    { text: "Kiss the person to your right on the cheek", emoji: "😘" },
                    { text: "Send a risky text to someone and show it", emoji: "⚠️" },
                    { text: "Dance alone in front of everyone for 1 minute", emoji: "🎉" },
                    { text: "Attempt a backflip or impressive physical feat", emoji: "🤸" },
                    { text: "Scream your crush's name out loud", emoji: "📣" },
                    { text: "Let someone style your hair however they want", emoji: "💇" },
                    { text: "Remove clothing and wear it as a hat", emoji: "🎩" },
                    { text: "Do 20 push-ups shirtless", emoji: "💪" },
                    { text: "Post your worst selfie on your story", emoji: "🤳" },
                ],
                intimate: [
                    { text: "Passionately kiss someone for 10 seconds", emoji: "💋" },
                    { text: "Give someone a lap dance to a song", emoji: "🔥" },
                    { text: "Send a shirtless/sexy selfie", emoji: "📸" },
                    { text: "Roleplay kissing a celebrity in front of everyone", emoji: "👫" },
                    { text: "Give someone a sensual body massage", emoji: "💆" },
                    { text: "Strip to your underwear and slow dance", emoji: "🔥" },
                    { text: "Let someone kiss you anywhere they choose", emoji: "💋" },
                    { text: "Do a slow sensual striptease to a song", emoji: "🎶" },
                    { text: "Take a shirtless/sexy photo with someone", emoji: "📷" },
                    { text: "Make out with someone for as long as you can", emoji: "😍" },
                    { text: "Give someone a full body sensual massage", emoji: "🤫" },
                    { text: "Describe your ideal sexual partner in detail", emoji: "😏" },
                    { text: "Whisper your dirtiest thought to someone's ear", emoji: "👂" },
                    { text: "Slow dance intimately with someone for 2 songs", emoji: "💕" },
                    { text: "Sit on someone's lap making intense eye contact", emoji: "👀" },
                    { text: "Do body shots with someone", emoji: "🍻" },
                    { text: "Kiss every person in the room on the lips", emoji: "💋" },
                    { text: "Give someone a lap dance", emoji: "🔥" },
                ]
            }
        };

        // ===== GAME STATE =====
        let gameState = {
            roomCode: null,
            playerName: null,
            players: [],
            scores: {},
            currentPlayerIndex: 0,
            round: 1,
            currentChallenge: null,
            selectedDifficulties: { easy: true, medium: true, hard: true, intimate: true },
            isHost: false,
            isPlaying: false
        };

        let socket = null;

        // ===== SOCKET.IO =====
        function initSocket() {
            const serverUrl = window.location.origin;
            socket = io(serverUrl, {
                reconnection: true,
                reconnectionDelay: 1000,
                reconnectionDelayMax: 5000,
                reconnectionAttempts: 10
            });

            socket.on('connect', () => {
                console.log('Connected to server');
                updateStatus('🟢 Connected', false);
            });

            socket.on('disconnect', () => {
                console.log('Disconnected from server');
                updateStatus('🔴 Disconnected', true);
            });

            socket.on('playerJoined', (data) => {
                gameState.players = data.players;
                gameState.scores = data.scores;
                gameState.currentPlayerIndex = data.currentPlayerIndex;
                gameState.round = data.round;
                updatePlayerDisplay();
            });

            socket.on('gameStarted', (data) => {
                gameState.players = data.players;
                gameState.selectedDifficulties = data.selectedDifficulties;
                gameState.isPlaying = true;
                gameState.currentPlayerIndex = 0;
                gameState.round = 1;
                pickChallenge();
                showScreen('playingScreen');
            });

            socket.on('nextPlayer', (data) => {
                gameState.currentPlayerIndex = data.currentPlayerIndex;
                gameState.round = data.round;
                pickChallenge();
            });

            socket.on('scoreUpdated', (data) => {
                gameState.scores = data.scores;
                updateLeaderboard();
            });

            socket.on('playerLeft', (data) => {
                gameState.players = data.players;
                gameState.scores = data.scores;
                updatePlayerDisplay();
            });

            socket.on('error', (message) => {
                alert('Error: ' + message);
            });
        }

        function updateStatus(text, isOffline) {
            const bar = document.getElementById('statusBar');
            bar.textContent = text;
            if (isOffline) {
                bar.classList.add('offline');
            } else {
                bar.classList.remove('offline');
            }
        }

        // ===== SCREEN MANAGEMENT =====
        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            window.scrollTo(0, 0);
        }

        function goToMenu() {
            if (gameState.roomCode && socket) {
                socket.emit('leaveRoom', { roomCode: gameState.roomCode, playerName: gameState.playerName });
            }
            gameState = { roomCode: null, playerName: null, players: [], scores: {}, currentPlayerIndex: 0, round: 1, currentChallenge: null, selectedDifficulties: { easy: true, medium: true, hard: true, intimate: true }, isHost: false, isPlaying: false };
            showScreen('menuScreen');
        }

        function showPlaying() {
            showScreen('playingScreen');
        }

        // ===== CREATE ROOM =====
        function showCreateRoom() {
            document.getElementById('setupTitle').textContent = '👥 Create Game';
            document.getElementById('codeDisplay').style.display = 'none';
            gameState.isHost = true;
            gameState.players = [];
            gameState.scores = {};
            gameState.selectedDifficulties = { easy: true, medium: true, hard: true, intimate: true };
            
            // Create room on server
            fetch('/api/rooms/create', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ playerName: 'Host' })
            })
            .then(r => r.json())
            .then(d => {
                if (d.success) {
                    gameState.roomCode = d.roomCode;
                    document.getElementById('codeDisplay').style.display = 'block';
                    document.getElementById('roomCode').textContent = gameState.roomCode;
                    document.getElementById('lobbyCode').textContent = gameState.roomCode;
                    initSocket();
                    socket.emit('joinRoom', { roomCode: gameState.roomCode, playerName: 'Host' });
                    updateDifficultyButtons();
                    showScreen('setupScreen');
                }
            });
        }

        // ===== JOIN ROOM =====
        function showJoinModal() {
            document.getElementById('joinModal').classList.add('active');
            document.getElementById('joinCode').focus();
        }

        function closeJoinModal() {
            document.getElementById('joinModal').classList.remove('active');
        }

        function joinRoom() {
            const code = document.getElementById('joinCode').value.toUpperCase().trim();
            const name = document.getElementById('joinName').value.trim();

            if (!code || code.length !== 6) {
                alert('Enter a valid 6-character room code');
                return;
            }
            if (!name) {
                alert('Enter your name');
                return;
            }

            fetch('/api/rooms/join', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ roomCode: code, playerName: name })
            })
            .then(r => r.json())
            .then(d => {
                if (d.success) {
                    gameState.roomCode = d.roomCode;
                    gameState.playerName = name;
                    gameState.players = d.room.players;
                    gameState.scores = Object.fromEntries(d.room.players.map(p => [p, 0]));
                    gameState.selectedDifficulties = d.room.selectedDifficulties;
                    gameState.isHost = false;
                    
                    closeJoinModal();
                    document.getElementById('setupTitle').textContent = `Joined as ${name}`;
                    document.getElementById('codeDisplay').style.display = 'block';
                    document.getElementById('roomCode').textContent = gameState.roomCode;
                    document.getElementById('lobbyCode').textContent = gameState.roomCode;
                    
                    initSocket();
                    socket.emit('joinRoom', { roomCode: gameState.roomCode, playerName: name });
                    updateDifficultyButtons();
                    updatePlayerDisplay();
                    showScreen('setupScreen');
                } else {
                    alert('Error: ' + (d.error || 'Failed to join'));
                }
            });
        }

        // ===== PLAYERS =====
        function addPlayer() {
            const input = document.getElementById('playerInput');
            const name = input.value.trim().replace(/[^a-zA-Z0-9 -]/g, '').substring(0, 20);
            
            if (!name) return;
            
            if (!gameState.players.includes(name)) {
                gameState.players.push(name);
                gameState.scores[name] = 0;
                gameState.playerName = name;
                input.value = '';
                updatePlayerDisplay();
                
                if (socket && gameState.roomCode) {
                    socket.emit('joinRoom', { roomCode: gameState.roomCode, playerName: name });
                }
            }
        }

        function updatePlayerDisplay() {
            const list = document.getElementById('playerList');
            list.innerHTML = gameState.players.map((p, i) => `
                <div class="player-item">
                    <span>${p}</span>
                    ${gameState.players.length > 1 ? `<button onclick="removePlayer(${i})">✕</button>` : ''}
                </div>
            `).join('');

            const lobbyList = document.getElementById('lobbyPlayers');
            if (lobbyList) {
                lobbyList.innerHTML = gameState.players.map(p => `<p>✅ ${p}</p>`).join('');
            }

            document.getElementById('startGameBtn').disabled = gameState.players.length < 1;
        }

        function removePlayer(index) {
            const name = gameState.players[index];
            gameState.players.splice(index, 1);
            delete gameState.scores[name];
            updatePlayerDisplay();
        }

        // ===== DIFFICULTY =====
        function toggleDifficulty(level) {
            gameState.selectedDifficulties[level] = !gameState.selectedDifficulties[level];
            updateDifficultyButtons();
            
            if (socket && gameState.roomCode) {
                socket.emit('updateDifficulties', { roomCode: gameState.roomCode, selectedDifficulties: gameState.selectedDifficulties });
            }
        }

        function updateDifficultyButtons() {
            document.querySelectorAll('.difficulty-btn').forEach(btn => {
                const text = btn.innerText.toLowerCase();
                const level = text.includes('easy') ? 'easy' : text.includes('medium') ? 'medium' : text.includes('hard') ? 'hard' : 'intimate';
                
                btn.className = 'difficulty-btn';
                btn.classList.add(gameState.selectedDifficulties[level] ? level : 'inactive');
            });
        }

        // ===== GAME LOGIC =====
        function startGame() {
            if (gameState.players.length < 1) {
                alert('Add at least 1 player!');
                return;
            }
            
            if (socket && gameState.roomCode) {
                socket.emit('startGame', { roomCode: gameState.roomCode });
            } else {
                // Fallback for non-multiplayer
                gameState.isPlaying = true;
                gameState.currentPlayerIndex = 0;
                gameState.round = 1;
                pickChallenge();
                showScreen('playingScreen');
            }
        }

        function startGameFromLobby() {
            startGame();
        }

        function pickChallenge() {
            const activeDifficulties = Object.keys(gameState.selectedDifficulties)
                .filter(d => gameState.selectedDifficulties[d]);
            const randomDifficulty = activeDifficulties[Math.floor(Math.random() * activeDifficulties.length)];
            const isTruth = Math.random() > 0.5;
            const categoryList = isTruth ? challenges.truth[randomDifficulty] : challenges.dare[randomDifficulty];
            const challenge = categoryList[Math.floor(Math.random() * categoryList.length)];

            gameState.currentChallenge = {
                ...challenge,
                type: isTruth ? 'Truth' : 'Dare',
                difficulty: randomDifficulty
            };

            updatePlayingDisplay();
        }

        function updatePlayingDisplay() {
            const player = gameState.players[gameState.currentPlayerIndex];
            document.getElementById('currentPlayer').textContent = player;
            document.getElementById('roundInfo').textContent = `Round ${gameState.round} • ${gameState.currentPlayerIndex + 1}/${gameState.players.length}`;

            const typeDiv = document.getElementById('challengeType');
            typeDiv.textContent = `${gameState.currentChallenge.type} • ${gameState.currentChallenge.difficulty.toUpperCase()}`;
            typeDiv.className = gameState.currentChallenge.type === 'Truth' ? 'challenge-type' : gameState.currentChallenge.difficulty === 'intimate' ? 'challenge-type intimate' : 'challenge-type dare';

            document.getElementById('challengeEmoji').textContent = gameState.currentChallenge.emoji;
            document.getElementById('challengeText').textContent = gameState.currentChallenge.text;

            const pointsMap = { easy: 10, medium: 25, hard: 50, intimate: 100 };
            document.getElementById('points').textContent = `+${pointsMap[gameState.currentChallenge.difficulty]} pts`;
        }

        function completeChallenge() {
            const pointsMap = { easy: 10, medium: 25, hard: 50, intimate: 100 };
            const player = gameState.players[gameState.currentPlayerIndex];
            
            if (socket && gameState.roomCode) {
                socket.emit('completeChallenge', { roomCode: gameState.roomCode, playerName: player, points: pointsMap[gameState.currentChallenge.difficulty] });
            } else {
                gameState.scores[player] = (gameState.scores[player] || 0) + pointsMap[gameState.currentChallenge.difficulty];
                nextPlayer();
            }
        }

        function differentChallenge() {
            pickChallenge();
        }

        function skipChallenge() {
            if (socket && gameState.roomCode) {
                socket.emit('skipChallenge', { roomCode: gameState.roomCode });
            } else {
                nextPlayer();
            }
        }

        function nextPlayer() {
            gameState.currentPlayerIndex = (gameState.currentPlayerIndex + 1) % gameState.players.length;
            if (gameState.currentPlayerIndex === 0) {
                gameState.round++;
            }
            pickChallenge();
        }

        function showScores() {
            updateLeaderboard();
            showScreen('scoresScreen');
        }

        function updateLeaderboard() {
            const sorted = [...gameState.players].sort((a, b) => gameState.scores[b] - gameState.scores[a]);
            const html = sorted.map((player, idx) => {
                const className = idx === 0 ? 'gold' : idx === 1 ? 'silver' : idx === 2 ? 'bronze' : '';
                const medal = idx === 0 ? '🥇' : idx === 1 ? '🥈' : idx === 2 ? '🥉' : `${idx + 1}.`;
                return `
                    <div class="leaderboard-item ${className}">
                        <div class="player-info">
                            <span class="medal">${medal}</span>
                            <span>${player}</span>
                        </div>
                        <span class="player-score">${gameState.scores[player] || 0}</span>
                    </div>
                `;
            }).join('');
            document.getElementById('leaderboard').innerHTML = html;
        }

        // ===== INIT =====
        initSocket();
        updateDifficultyButtons();
    </script>
</body>
</html>
